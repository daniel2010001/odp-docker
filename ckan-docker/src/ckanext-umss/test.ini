[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = ckan@localhost

[app:main]
use = config:../../src/ckan/test-core.ini

# Insert any custom config settings to be used when running your extension's
# tests here. These will override the one defined in CKAN core's test-core.ini
ckan.plugins = umss

# ─── Correr esta suite dentro del contenedor de la app DESTRUYE la base ────
# `ckan-dev` exporta `CKAN_SQLALCHEMY_URL`, `CKAN_SOLR_URL` y `CKAN_SITE_ID`, y
# `update_config()` (ckan/config/environment.py) los aplica con precedencia
# sobre CUALQUIER ini vía `CONFIG_FROM_ENV_VARS`. Medido el 2026-09-21: con este
# archivo tal cual, `load_config()` da `ckan_test` / `solr/ckan_test` /
# `test.ckan.net`, y **después de `make_app()`** el proceso ve `ckandb` (la base
# de dev) y `solr/ckan` (el core compartido). `clean_db` no trunca: refleja el
# esquema y hace `drop_all` (ckan/model/__init__.py), así que una corrida borra el
# esquema y los datos de la base de dev, y mete documentos en el core que el
# stack sí lee.
#
# La suite se NIEGA a arrancar en ese estado: `conftest.py` resuelve la
# configuración efectiva en `pytest_sessionstart` —antes de que CKAN abra la
# conexión— y aborta con USAGE_ERROR si la base que el driver va a abrir o el core
# de Solr no terminan en `_test` (`ckanext/umss/tests/target_guard.py`). La base se
# lee de la traducción del driver, no del path: un query como `?database=…` puede
# cambiar el destino real. Eso cubre el caso de escribir `pytest` a mano;
# `ckan-docker/bin/test-umss` sigue siendo la forma soportada.
#
# Hay que neutralizar esas variables en la invocación; el ini no alcanza. La receta
# NO lleva credenciales: se copian las del `.env` del stack cambiando el último
# segmento del path por el nombre de test, y la contraseña va dentro de la URL que
# ya vive en ese archivo — no en la línea de comando, donde queda en el historial
# del shell y a la vista de cualquiera que liste procesos.
#   docker exec \
#     -e CKAN_SQLALCHEMY_URL="<la del .env, con el ÚLTIMO SEGMENTO del path en ck/test>" \
#     -e CKAN_DATASTORE_WRITE_URL="<idem, la de escritura>" \
#     -e CKAN_DATASTORE_READ_URL="<idem, la de lectura>" \
#     -e CKAN_SOLR_URL="<la del .env, con el core de test>" \
#     -e CKAN_SITE_ID=test.ckan.net \
#     odp-dev-ckan-dev-1 bash -lc \
#     'cd /srv/app/src_extensions/ckanext-umss && python -m pytest --ckan-ini=test.ini'
# Verificado: 22 passed, `ckandb` intacta (mismos timestamps) y el core
# compartido sin cambios.
#
# `solr_url` queda igual porque `synchronous_search` es un *system plugin*
# (ckan/plugins/core.py: no se puede desactivar) y un checkout suelto de la
# extensión no debe escribir en el core compartido. El core se crea una vez por
# volumen de Solr; el `configSet` absoluto es obligatorio (un nombre suelto se
# resuelve contra `<solr.home>/configsets`, sin el esquema de CKAN):
#   curl "http://solr:8983/solr/admin/cores?action=CREATE&name=ckan_test&configSet=/opt/solr/server/solr/configsets/ckan"
solr_url = http://solr:8983/solr/ckan_test


# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
