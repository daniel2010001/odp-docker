# Alembic configuration for the `umss` extension's own migrations.
#
# `script_location = %(here)s` resolves to this file's own directory, so the
# tree travels with the extension. The placeholder URL below is never used:
# `ckan db upgrade` and the `migrate_db_for` test fixture both inject
# `sqlalchemy.url` from the *effective* CKAN configuration before running
# anything (`ckan/model/__init__.py:311-336`).
#
# The version table is named after the directory holding this file
# (`<plugin>_alembic_version`), which `env.py` derives — see there.

[alembic]
# path to migration scripts
script_location = %(here)s

sqlalchemy.url = driver://user:pass@localhost/dbname


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
