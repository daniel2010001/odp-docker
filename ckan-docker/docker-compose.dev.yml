volumes:
  ckan_storage:
  pg_data:
  solr_data:
  pip_cache:
  # Pinned to the interpreter: an old py3.10 volume mounted at the new path hides site-packages and CKAN fails to boot.
  site_packages_py314:
  local_bin:
  home_dir:

# XLoader settings shared by the web service and the worker. The envvars plugin maps
# CKANEXT__XLOADER__X to ckanext.xloader.x (and overrides the ini). The submit runs in
# `ckan-dev`, the job in `ckan-worker-dev`, and both write the jobs table, so both need these.
x-xloader-env: &xloader-env
  # Rewrites the scheme+netloc of the resource download URL: the worker reaches CKAN
  # through the internal network, not through the public URL.
  CKANEXT__XLOADER__SITE_URL: http://ckan-dev:5000
  # The CKAN database, never sqlite in /tmp (lost on restart, not shared by the two
  # containers) and never the DataStore DB (the `jobs` table stores `api_key`).
  CKANEXT__XLOADER__JOBS_DB__URI: ${CKAN_SQLALCHEMY_URL}
  # dd/mm/yyyy dates; pairs with the DataStore database DateStyle `ISO, DMY`.
  CKANEXT__XLOADER__PARSE_DATES_DAYFIRST: "true"

# Authorization policy, versioned here and not in `.env`: `environment` wins over
# `env_file`, so a local `.env` cannot reopen it (tests/test-org-create-policy.sh).
x-auth-env: &auth-env
  # Only a sysadmin creates organizations (PRD); CKAN 2.12 defaults this to true.
  # `user_create_groups` stays at its default: any registered user creates
  # collections (RF-21).
  CKAN__AUTH__USER_CREATE_ORGANIZATIONS: "false"
  # Only a sysadmin deletes organizations (RF-35). With the default (true),
  # `organization_delete` only asks for `delete` on the org, which its `admin`
  # role holds. `user_delete_groups` stays at its default.
  CKAN__AUTH__USER_DELETE_ORGANIZATIONS: "false"

services:

  ckan-dev:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile.dev
      args:
        - TZ=${TZ}
    env_file:
      - .env
    environment:
      <<: [*xloader-env, *auth-env]
    links:
      - db
      - solr
      - redis
    ports:
      - "0.0.0.0:${CKAN_PORT_HOST}:5000"
    volumes:
      - ckan_storage:/var/lib/ckan
      - ./src:/srv/app/src_extensions
      - pip_cache:/root/.cache/pip
      - site_packages_py314:/usr/local/lib/python3.14/site-packages
      - local_bin:/usr/local/bin
      - home_dir:/srv/app/
    restart: unless-stopped
    healthcheck:
      # `wget` is not in the CKAN 2.12 images: this probe exited 127, so `ckan-dev` reported
      # `unhealthy` while serving normally. `curl` exists today but is incidental; Python cannot
      # be missing while CKAN is running.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000', timeout=5).read()"]
      interval: 60s
      timeout: 10s
      retries: 3

  # `ckan jobs worker`: consumes the RQ queue where xloader's jobs go. Without it jobs
  # pile up in Redis and nothing is ever loaded into the DataStore. Same image and volumes
  # as `ckan-dev` (so the live ./src extension and the volume-held installs match); no ports.
  ckan-worker-dev:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile.dev
      args:
        - TZ=${TZ}
    env_file:
      - .env
    environment:
      <<: [*xloader-env, *auth-env]
    links:
      - db
      - solr
      - redis
    depends_on:
      ckan-dev:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
      - ./src:/srv/app/src_extensions
      - pip_cache:/root/.cache/pip
      - site_packages_py314:/usr/local/lib/python3.14/site-packages
      - local_bin:/usr/local/bin
      - home_dir:/srv/app/
    command: ["/srv/worker/start_ckan_worker.sh"]
    restart: unless-stopped

  db:
    build:
      context: postgresql/
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CKAN_DB_USER
      - CKAN_DB_PASSWORD
      - CKAN_DB
      - DATASTORE_READONLY_USER
      - DATASTORE_READONLY_PASSWORD
      - DATASTORE_DB
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
     
  solr:
    platform: linux/amd64
    image: ckan/ckan-solr:${SOLR_IMAGE_VERSION}
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/"]

  redis:
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]
