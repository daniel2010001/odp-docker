volumes:
  ckan_storage:
  pg_data:
  solr_data:
  pip_cache:
  # No volume over site-packages here: CKAN and ckanext-umss are installed there by the image, and a
  # named volume keeps the first image's code across every rebuild (tests/test-prod-site-packages.sh).

# XLoader settings shared by the web service and the worker. The envvars plugin maps
# CKANEXT__XLOADER__X to ckanext.xloader.x (and overrides the ini). The submit runs in
# `ckan`, the job in `ckan-worker`, and both write the jobs table, so both need these.
x-xloader-env: &xloader-env
  # Rewrites the scheme+netloc of the resource download URL: the worker reaches CKAN
  # through the internal network, not through the public URL.
  CKANEXT__XLOADER__SITE_URL: http://ckan:5000
  # The CKAN database, never sqlite in /tmp (lost on restart, not shared by the two
  # containers) and never the DataStore DB (the `jobs` table stores `api_key`).
  CKANEXT__XLOADER__JOBS_DB__URI: ${CKAN_SQLALCHEMY_URL}
  # dd/mm/yyyy dates; pairs with the DataStore database DateStyle `ISO, DMY`.
  CKANEXT__XLOADER__PARSE_DATES_DAYFIRST: "true"

# Authorization policy, versioned here and not in `.env`: `environment` wins over
# `env_file`, so a local `.env` cannot reopen it (tests/test-org-create-policy.sh).
x-auth-env: &auth-env
  # Only a sysadmin creates organizations (PRD); CKAN 2.12 defaults this to true.
  # `user_create_groups` stays at its default: any registered user creates
  # collections (RF-21).
  CKAN__AUTH__USER_CREATE_ORGANIZATIONS: "false"
  # Only a sysadmin deletes organizations (RF-35). With the default (true),
  # `organization_delete` only asks for `delete` on the org, which its `admin`
  # role holds. `user_delete_groups` stays at its default.
  CKAN__AUTH__USER_DELETE_ORGANIZATIONS: "false"

services:

  nginx:
    build:
      context: nginx/
      dockerfile: Dockerfile
    networks:
      - webnet
      - ckannet
    depends_on:
      ckan:
        condition: service_healthy
    ports:
      - "0.0.0.0:${NGINX_SSLPORT_HOST}:${NGINX_SSLPORT}"
    
  ckan:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    networks:
      - ckannet
      - dbnet
      - solrnet
      - redisnet
    env_file:
      - .env
    environment:
      <<: [*xloader-env, *auth-env]
      # uWSGI's http router answers HTTP/1.1 without `Connection: close` and then closes the socket,
      # so the portal's pooled connection dies under its next request (UND_ERR_SOCKET -> 502 "no se
      # pueden cargar los graficos"). Every response now declares the close. Real keep-alive
      # (`--http-keepalive`) was not chosen: it reopens the race through uWSGI's idle close vs the
      # portal's 4 s pool. start_ckan.sh word-splits this value: no spaces inside the header value
      # (tests/test-uwsgi-connection.sh).
      EXTRA_UWSGI_OPTS: "--add-header Connection:close"
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
      - pip_cache:/root/.cache/pip
    restart: unless-stopped
    healthcheck:
      # `wget` is not in the CKAN 2.12 images: this probe exited 127, so CKAN reported `unhealthy`
      # while serving normally, and the `nginx` service below waits on `ckan: service_healthy` —
      # it never started. `curl` exists today but is incidental; Python cannot be missing while
      # CKAN is running, and the traceback names the failure when the probe does fail.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/action/status_show', timeout=5).read()"]
      interval: 60s
      timeout: 10s
      retries: 3
    
  # `ckan jobs worker`: consumes the RQ queue where xloader's jobs go. Without it jobs
  # pile up in Redis and nothing is ever loaded into the DataStore. Same image as `ckan`;
  # no ports and no `ckan_storage` (it reads resources over HTTP from `ckan`).
  ckan-worker:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    networks:
      - ckannet
      - dbnet
      - solrnet
      - redisnet
    env_file:
      - .env
    environment:
      <<: [*xloader-env, *auth-env]
    depends_on:
      ckan:
        condition: service_healthy
    command: ["/srv/worker/start_ckan_worker.sh"]
    restart: unless-stopped

  db:
    build:
      context: postgresql/
    networks:
      - dbnet
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CKAN_DB_USER
      - CKAN_DB_PASSWORD
      - CKAN_DB
      - DATASTORE_READONLY_USER
      - DATASTORE_READONLY_PASSWORD
      - DATASTORE_DB
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
     
  solr:
    platform: linux/amd64
    networks:
      - solrnet
    image: ckan/ckan-solr:${SOLR_IMAGE_VERSION}
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/"]

  redis:
    image: redis:${REDIS_VERSION}
    networks:
      - redisnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]
    
networks:
  webnet:
  ckannet:
  solrnet:
    internal: true
  dbnet:
    internal: true
  redisnet:
    internal: true
