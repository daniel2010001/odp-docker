# docker-compose.dev.unified.yml
#
# Entorno de DESARROLLO unificado (hot reload) para el homelab:
#   - CKAN dev (extensión umss en vivo vía bind mount, sin rebuild)
#   - Frontend Vite dev server (HMR) con el código montado en vivo
#   - nginx frontend-proxy: / -> frontend, /api/ -> ckan-dev (con WebSocket)
#
# Diferencia con docker-compose.unified.yml (producción): aquí NO se hornea
# umss en la imagen ni se compila el frontend; todo se recarga en caliente.
#
# Uso:
#   docker compose -f docker-compose.dev.unified.yml up -d --build
#   # directo:  http://192.168.1.201:8082
#   # vía Caddy: https://odp.hs.lan  (requiere DNS rewrite en AdGuard + hs-net)
#
# Nombre de proyecto distinto (odp-dev) para no chocar con el stack prod.

name: odp-dev

include:
  # CKAN dev: ckan-dev + db + solr + redis + datapusher, con ./src montado
  # en /srv/app/src_extensions (la extensión umss se recarga en vivo).
  - ./ckan-docker/docker-compose.dev.yml

services:

  # ─── Override del ckan-dev incluido: hornea umss (editable) ──
  # Reemplaza el build del docker-compose.dev.yml para que la extensión
  # umss quede instalada y recargable en vivo (bind mount).
  ckan-dev:
    build:
      context: ./ckan-docker
      dockerfile: Dockerfile.dev.umss
    volumes:
      # El script de arranque de la imagen `ckan-dev` fuerza `debug = true` en
      # cada boot, y eso activa el Flask-DebugToolbar, que publica la config
      # entera de CKAN (credenciales de la base incluidas) a quien abra
      # http://<host>:5000/ sin autenticarse. `/docker-entrypoint.d/` es el punto
      # que corre DESPUÉS de esa línea y antes de levantar el servidor.
      # Montado (y no sólo COPYeado en la imagen) para que aplique sin rebuild;
      # el `COPY ... /docker-entrypoint.d/` del Dockerfile ya lo hornea para
      # quien reconstruya.
      - ./ckan-docker/ckan/docker-entrypoint.d/02_disable_debug_toolbar.sh:/docker-entrypoint.d/02_disable_debug_toolbar.sh:ro
      # La migración de la extensión. Sin esto el stack de dev sirve la extensión pero
      # **sin la tabla del store** hasta que alguien corra `ckan db upgrade -p umss` a mano,
      # y el `SUCCESS` de ese CLI no prueba nada: con `-p <plugin>` y `--skip-core` es un
      # no-op silencioso. El script corre la migración y **verifica la tabla**.
      - ./ckan-docker/ckan/docker-entrypoint.d/03_upgrade_umss_schema.sh:/docker-entrypoint.d/03_upgrade_umss_schema.sh:ro

    # ─── Andamiaje de DEV (homelab) — NO es el diseño de producción ───
    # CKAN necesita un ORIGEN PROPIO para que el navegador pueda cargar sus
    # recursos: el portal se sirve por `https://odp.hs.lan` y CKAN firmaba sus
    # URLs absolutas con `http://192.168.1.201:5000`, así que el visor de PDF
    # quedaba bloqueado por contenido mixto (`ResourcePreview.svelte` usa un
    # `<iframe>` a propósito, porque la API no manda CORS).
    #
    # En PRODUCCIÓN los nombres son otros —`data.umss.edu.bo` para el portal y
    # `api.data.umss.edu.bo` para CKAN, con otro proxy delante— así que esto es
    # andamiaje del homelab y vive acá, en el compose de dev, y no en el del
    # sub-stack. Lo único que viaja a producción es el INVARIANTE: `ckan.site_url`
    # debe ser exactamente la URL pública de CKAN, con el mismo esquema que el
    # portal (en dev, `https://api.odp.hs.lan`; en prod, `https://api.data.umss.edu.bo`).
    #
    # Caddy va directo al contenedor (sin el nginx intermedio): CKAN ignora el
    # `Host` de la petición —arma sus URLs desde `ckan.site_url`— así que no hace
    # falta que nadie elija upstream por nombre.
    # OJO con la trampa del override: `networks` **REEMPLAZA** la lista del archivo
    # incluido, no la amplía. Medido: con sólo `hs-net` acá, `ckan-dev` deja de
    # resolver `db` y `solr` y el stack se cae. Por eso van las dos.
    networks:
      - default                     # db, solr, redis y el resto del stack
      - hs-net                      # lo alcanza Caddy (homelab)
    labels:
      - "caddy=api.odp.hs.lan"
      - "caddy.tls=internal"
      - "caddy.reverse_proxy={{upstreams 5000}}"

  # ─── Frontend Vite dev server (HMR) ─────────────────────────
  frontend-dev:
    build:
      context: ../odp
      dockerfile: Dockerfile.dev
    volumes:
      - ../odp/src:/app/src        # código fuente en vivo (HMR)
      - ../odp/static:/app/static  # assets en vivo
    environment:
      # Apunta el proxy interno de Vite a ckan-dev (por si se accede a :5173 directo)
      CKAN_PROXY_TARGET: http://ckan-dev:5000
      # URL interna de CKAN para el proxy server-side de /auth/login.
      # Dentro del contenedor, localhost:5000 NO es CKAN: debe apuntar a ckan-dev.
      CKAN_INTERNAL_URL: http://ckan-dev:5000
      # Puerto público del proxy para el cliente HMR. 8082 => acceso directo.
      # Si exponés vía Caddy (https://odp.hs.lan, TLS), cambialo a 443.
      VITE_HMR_CLIENT_PORT: "8082"
    depends_on:
      - ckan-dev
    expose:
      - "5173"
    restart: unless-stopped

  # ─── Reverse proxy nginx (entrada al stack dev) ────────────
  frontend-proxy:
    image: nginx:alpine
    volumes:
      - ./frontend-proxy/dev-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"                   # acceso directo LAN (sin Caddy)
    networks:
      - default                     # alcanza frontend-dev y ckan-dev
      - hs-net                      # lo alcanza Caddy (homelab)
    depends_on:
      - frontend-dev
    restart: unless-stopped
    # Exposición label-driven vía Caddy (homelab):
    #   https://odp.hs.lan  ->  frontend-proxy:80
    labels:
      - "caddy=odp.hs.lan"
      - "caddy.tls=internal"
      - "caddy.reverse_proxy={{upstreams 80}}"

networks:
  hs-net:
    external: true
