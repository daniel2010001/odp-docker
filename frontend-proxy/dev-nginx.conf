# dev-nginx — reverse proxy para el entorno de desarrollo (hot reload)
#
# Rutas:
#   /      -> frontend-dev (Vite dev server, HMR) con soporte WebSocket
#   /api/  -> ckan-dev (CKAN dev, extensión umss en vivo)
#
# El Upgrade/Connection permite que el HMR de Vite funcione a través
# del proxy (WebSocket ws:// -> wss://).

server {
    listen 80;
    server_name _;

    # ─── API de CKAN (dev) ───────────────────────────────────
    location /api/ {
        proxy_pass http://ckan-dev:5000;

        # Techo de subida de recursos. Sin esta directiva nginx usa su default de
        # 1 MB y toda subida mayor devuelve 413 antes de llegar a CKAN, aunque
        # CKAN acepte hasta 100 MB (CKAN_MAX_UPLOAD_SIZE_MB). El limite de la
        # aplicacion es 50 MB por recurso (PRD RF-12); 55M deja holgura para el
        # overhead del multipart.
        #
        # El mismo techo rige en /catalog/ (abajo), la ruta de subida del portal.
        # En dev el frontend no impone techo propio: Vite no tiene el
        # BODY_SIZE_LIMIT de adapter-node. `tests/test-upload-body-limit.sh`
        # exige que /api/ y /catalog/ coincidan.
        client_max_body_size 55M;

        # `$host` (no `$http_host`) a propósito: nginx descarta el puerto y acá es lo
        # correcto — CKAN arma sus URLs absolutas desde `ckan.site_url` e ignora el
        # Host de la petición (medido). Además evita reenviar al backend un Host sin
        # validar, que es lo que haría `$http_host`.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # ─── Subidas del portal (dev) ───────────────────────────
    # Sin este bloque /catalog/ cae en `location /`, con el default de nginx de
    # 1 MB: un 413 antes de que el portal vea un byte. Mismo techo que /api/;
    # `location /` queda en el default a propósito.
    location /catalog/ {
        proxy_pass http://frontend-dev:5173;
        client_max_body_size 55M;

        # `$http_host` por la misma razón que en `location /`.
        proxy_set_header Host $http_host;
    }

    # ─── Frontend Vite (HMR) ────────────────────────────────
    location / {
        proxy_pass http://frontend-dev:5173;

        # HMR WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # `$http_host` (no `$host`) a propósito: `$host` descarta el puerto, y
        # SvelteKit/Vite derivan la URL de la petición desde este header, así que el
        # SSR creía servir en el puerto 80 (medido: /dev/preview generaba
        # http://192.168.1.201/dev/... en vez de :8082).
        proxy_set_header Host       $http_host;
    }
}
