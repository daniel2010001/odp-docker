# dev-nginx — reverse proxy para el entorno de desarrollo (hot reload)
#
# Rutas:
#   /      -> frontend-dev (Vite dev server, HMR) con soporte WebSocket
#   /api/  -> ckan-dev (CKAN dev, extensión umss en vivo)
#
# El Upgrade/Connection permite que el HMR de Vite funcione a través
# del proxy (WebSocket ws:// -> wss://).

server {
    listen 80;
    server_name _;

    # ─── API de CKAN (dev) ───────────────────────────────────
    location /api/ {
        proxy_pass http://ckan-dev:5000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # ─── Frontend Vite (HMR) ────────────────────────────────
    location / {
        proxy_pass http://frontend-dev:5173;

        # HMR WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }
}
