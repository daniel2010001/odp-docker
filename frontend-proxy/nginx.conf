# frontend-proxy — reverse proxy same-origin (sin CORS)
#
# Rutas:
#   /      -> frontend SvelteKit (http://frontend:3000)
#   /api/  -> CKAN (http://ckan:5000) SIN reescribir el path
#             CKAN espera /api/3/action/<action>, por eso NO se usa
#             una barra final en proxy_pass (se pasa el URI intacto).

server {
    listen 80;
    server_name _;

    # ─── API de CKAN ──────────────────────────────────────────
    # Sin URI en proxy_pass => nginx reenvía el URI original sin cambios:
    #   /api/3/action/status_show  ->  http://ckan:5000/api/3/action/status_show
    location /api/ {
        proxy_pass http://ckan:5000;

        # Techo de subida de recursos. Sin esta directiva nginx usa su default de
        # 1 MB y toda subida mayor devuelve 413 antes de llegar a CKAN, aunque
        # CKAN acepte hasta 100 MB (CKAN_MAX_UPLOAD_SIZE_MB). El limite de la
        # aplicacion es 50 MB por recurso (PRD RF-12); 55M deja holgura para el
        # overhead del multipart.
        #
        # Ojo: este proxy NO reenvia al nginx de CKAN para /api/ (proxy_pass
        # directo a ckan:5000), asi que el client_max_body_size de
        # ckan-docker/nginx/setup/nginx.conf (140M) no aplica aca: manda este.
        #
        # El mismo techo rige en /catalog/ (abajo), la ruta de subida del portal,
        # y en el BODY_SIZE_LIMIT del frontend (docker-compose.unified.yml).
        # `tests/test-upload-body-limit.sh` exige que los tres coincidan.
        client_max_body_size 55M;

        # `$host` (no `$http_host`) a propósito: nginx descarta el puerto y acá es lo
        # correcto — CKAN arma sus URLs absolutas desde `ckan.site_url` e ignora el
        # Host de la petición (medido en dev). Además evita reenviar al backend un
        # Host sin validar, que es lo que haría `$http_host`.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evita que nginx buferice respuestas grandes de la API (datasets, CSV)
        proxy_buffering off;
    }

    # ─── Subidas del portal ──────────────────────────────────
    # Las subidas de recursos (resource_create/resource_update multipart) pasan
    # por el servidor del portal, que inyecta la credencial y reenvía a CKAN.
    # Sin este bloque /catalog/ cae en `location /`, con el default de nginx de
    # 1 MB: un 413 antes de que el portal vea un byte. Mismo techo que /api/;
    # `location /` queda en el default a propósito, así los cuerpos grandes se
    # aceptan sólo en la ruta de subida.
    location /catalog/ {
        proxy_pass http://frontend:3000;
        client_max_body_size 55M;

        # Mismos headers que `location /`, por la misma razón (`$http_host`).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Frontend SvelteKit ──────────────────────────────────
    location / {
        proxy_pass http://frontend:3000;

        # `$http_host` (no `$host`) a propósito: `$host` descarta el puerto, y
        # adapter-node deriva la URL de la petición desde este header, así que el
        # SSR creía servir en el puerto 80 y firmaba URLs absolutas sin puerto.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
