# docker-compose.unified.yml
#
# Stack unificado: CKAN + Frontend (SvelteKit) servidos detrás de un único
# reverse proxy nginx (same-origin), sin necesidad de CORS.
#
# Estructura:
#   - `include` trae el stack CKAN completo (nginx, ckan, ckan-worker, db,
#     solr, redis) y sus redes (webnet, ckannet, solrnet, dbnet, redisnet).
#   - `frontend`        : app SvelteKit compilada con adapter-node (build/).
#                         Expone solo 3000 interno, sin puerto host.
#   - `frontend-proxy`  : nginx que enruta / -> frontend y /api/ -> ckan.
#                         Único punto de entrada público (puerto 8080 del host).
#
# Conectividad:
#   - frontend y frontend-proxy viven en `ckannet` (red interna donde ckan
#     también es alcanzable). frontend-proxy llega a ckan:5000 y frontend:3000
#     por esa red, y además se publica al host por 8080:80.
#
# Uso:
#   docker compose -f docker-compose.unified.yml up --build
#   # frontend  -> http://localhost:8080
#   # ckan (api) -> http://localhost:8080/api/3/action/status_show

include:
  # Stack CKAN ya existente (repo separado). Sus servicios, redes y variables
  # de entorno (.env) se cargan/mezclan en este proyecto sin modificarlo.
  - ./ckan-docker/docker-compose.yml

services:

  # ─── Override del ckan incluido: imagen con la extensión umss ──
  # Reemplaza el build del docker-compose.yml de ckan-docker para
  # hornear ckanext-umss dentro de la imagen de producción.
  ckan:
    build:
      context: ./ckan-docker
      dockerfile: Dockerfile.umss

  # Mismo build que `ckan`: el worker de xloader corre la misma imagen.
  ckan-worker:
    build:
      context: ./ckan-docker
      dockerfile: Dockerfile.umss

  # ─── Frontend SvelteKit (adapter-node) ─────────────────────
  frontend:
    build:
      context: ../odp
      args:
        # Vacío => el cliente HTTP usa rutas relativas /api/... (same-origin)
        PUBLIC_CKAN_URL: ""
    environment:
      # URL interna de CKAN para el proxy server-side de /auth/login.
      # Dentro de la red ckannet, ckan:5000 es la instancia de producción.
      CKAN_INTERNAL_URL: http://ckan:5000
      # Clave que sella la cookie de sesión del portal (AES-256-GCM). Obligatoria y
      # sin valor por defecto: con uno, cualquiera podría fabricar sesiones. Sin ella
      # Compose se niega a arrancar. Se lee del `.env` de la RAÍZ de este repo (ver
      # `.env.example`), no de `ckan-docker/.env`.
      SESSION_SECRET: ${SESSION_SECRET:?falta SESSION_SECRET en .env de la raiz (ver .env.example)}
      # Techo del cuerpo de adapter-node para /catalog/ (subidas de recursos). Su
      # default es 512 KB y, pasado, responde 400 (no 413). Igual al
      # client_max_body_size de /api/ y /catalog/ en frontend-proxy/nginx.conf:
      # 50 MB por recurso (PRD RF-12) más overhead del multipart, por debajo de los
      # 100 MB efectivos de CKAN. `tests/test-upload-body-limit.sh` exige que coincidan.
      BODY_SIZE_LIMIT: 55M
    # Se conecta a la red donde nginx/ckan son alcanzables para que el proxy
    # pueda llegar a él en :3000.
    networks:
      - ckannet
    depends_on:
      ckan:
        condition: service_healthy
    # Solo expuesto dentro de las redes de Compose (no se publica al host).
    expose:
      - "3000"
    restart: unless-stopped

  # ─── Reverse proxy nginx (punto de entrada público) ────────
  frontend-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ckannet
      - webnet
    depends_on:
      - frontend
    restart: unless-stopped
